name: Deploy Saude Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'

jobs:
  deploy:
    name: Deploy Notebook to Databricks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = https://adb-7405608954459582.2.azuredatabricks.net
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Create workspace folder
        run: databricks workspace mkdirs /saude

      - name: Upload notebook to Databricks
        run: |
          databricks workspace import --language PYTHON --overwrite functions/transform/transform_databricks.py /saude/transform_saude

      - name: Done
        run: echo "Deploy concluido!"
